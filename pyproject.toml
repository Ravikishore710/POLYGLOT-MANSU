[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-mansu"
version = "0.1.0"
description = "Cross-Lingual, Quantization-Permanent Circuit Unlearning for Multilingual Edge LLMs"
authors = [
    { name = "Polyglot-MANSU Team" }
]
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "circuitkit>=0.2.0",
    "safetune>=0.1.10",
    "curatorkit>=0.1.20",
    "auditkit>=1.1.0",
    "transformer-lens==3.8.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
    "litellm>=1.40.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "pydantic>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0"
]
space = [
    "gradio>=5.0.0",
    "plotly>=5.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"
